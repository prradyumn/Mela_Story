<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Mela Before Sunset · Game v1</title>
<link rel="preload" href="assets/fonts/baloo-2-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/fredoka-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="bg"></div>

    <!-- price tag on its rope -->
    <div id="tagRig" class="hidden">
      <div id="rope"></div>
      <div id="tag">
        <img id="tagIcon" alt="">
        <div id="tagText"><div id="tagName"></div><div id="tagPrice"></div></div>
        <div id="tagStamp"></div>
      </div>
    </div>

    <!-- number line -->
    <div id="numline" class="hidden">
      <img class="nl-tick" id="tickL" src="assets/img/nl_tick_big.webp" alt="">
      <img class="nl-tick" id="tickR" src="assets/img/nl_tick_big.webp" alt="">
      <img class="nl-tick mid" id="tickM" src="assets/img/nl_tick_big.webp" alt="">
      <img id="nlBar" src="assets/img/nl_bar.webp" alt="">
      <div class="nl-label" id="labL"></div>
      <div class="nl-label mid" id="labM"></div>
      <div class="nl-label" id="labR"></div>
    </div>
    <div class="marker hidden" id="marker"><img src="assets/img/nl_marker.webp" alt=""><span></span></div>
    <div class="marker hidden" id="markerGreen"><img src="assets/img/nl_marker_green.webp" alt=""><span></span></div>

    <!-- answer buttons -->
    <div class="btn hidden" id="btnL" data-side="L"><span class="lbl"></span><i class="tick-badge"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></i></div>
    <div class="btn hidden" id="btnR" data-side="R"><span class="lbl"></span><i class="tick-badge"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></i></div>
    <div class="abs hidden" id="btnSkip">Skip <svg viewBox="0 0 24 24"><path d="M5 5l8 7-8 7zM13 5l8 7-8 7z" fill="currentColor"/></svg></div>

    <!-- Gudiya + reactions -->
    <div id="gudiya" class="hidden"><div class="shadow"></div><div class="body"><div class="flip"></div></div></div>
    <div id="bleat" class="abs">Meh-eh!</div>

    <!-- cart (appears only when an item is collected) -->
    <div id="cart" class="abs"><div id="cartItems"></div><img class="cart-img" src="assets/img/cart_empty.webp" alt=""><div id="cartCount">0 / 7</div></div>

    <!-- hint strip + hand -->
    <div id="rule" class="abs"><span class="bulb"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z" fill="#f7b733" stroke="#8a5a10" stroke-width="1.6" stroke-linejoin="round"/></svg></span><span id="ruleText"></span></div>
    <img id="hand" class="abs" src="assets/img/ui_hand.webp" alt="">

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="chip abs" id="chip"></div>
      <div class="round-btn abs" id="btnSpeaker" title="Hear it again"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#3a220f"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#3a220f" stroke-width="2" stroke-linecap="round"/></svg></div>
      <div class="round-btn abs" id="btnMusic" title="Music on/off"><svg viewBox="0 0 24 24"><path d="M9 17V5l11-2v12" fill="none" stroke="#3a220f" stroke-width="2.2" stroke-linejoin="round"/><circle cx="6.5" cy="17.5" r="2.8" fill="#3a220f"/><circle cx="17.5" cy="15" r="2.8" fill="#3a220f"/></svg></div>
      <div class="abs" id="mariPlate"></div>
      <div class="abs" id="sunPanel"></div>
      <div class="glow-ring" id="glowMari" style="left:678px;top:14px;width:564px;height:116px"></div>
      <div class="glow-ring" id="glowSun" style="left:1558px;top:4px;width:344px;height:180px;border-radius:36px"></div>
    </div>

    <!-- coach: avatar + speech bubble -->
    <div id="coach" class="hidden">
      <div class="abs" id="avatar"><img alt=""></div>
      <div class="abs" id="bubble"><div id="bubbleName"></div><div id="bubbleText"></div><div id="bubbleMore">tap ▸</div></div>
    </div>

    <!-- title -->
    <div class="overlay" id="titleOv">
      <div class="dim"></div>
      <div class="card" id="titleCard">
        <div class="lvl">Level 1</div>
        <h1>Aakoli Bazaar</h1>
        <p>Round the price tags before sunset</p>
        <div id="titleIcons"></div>
        <div class="btn cta" id="btnPlay">Let’s play!</div>
      </div>
    </div>

    <!-- level complete -->
    <div class="overlay hidden" id="doneOv">
      <div class="card" id="doneCard">
        <h2>7 of 7 done!</h2>
        <div class="sub">Every price is a round number now.</div>
        <div id="doneStars"><img alt=""><img alt=""><img alt=""></div>
        <img id="doneCart" src="assets/img/cart_full.webp" alt="">
        <div id="doneScore"></div>
        <div class="btn cta abs" id="doneCta">Go to the office</div>
      </div>
    </div>

    <div id="fx"></div>
    <div id="toast" class="abs"></div>
  </div>
</div>

<script src="js/vendor/gsap.min.js"></script>
<script src="js/data/level1.js"></script>
<script src="js/audio.js"></script>
<script src="js/stage.js"></script>
<script src="js/hud.js"></script>
<script src="js/gudiya.js"></script>
<script src="js/scene.js"></script>
<script src="js/level1.js"></script>
<script src="js/main.js"></script>
</body>
</html>
